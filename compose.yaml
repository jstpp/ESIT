services:
  web:
    build:
      dockerfile: ./setup/web-dockerfile
      args:
      - UID=${H_UID:-1000}
      - GID=${H_GID:-1000}
    ports:
      - '80:80'
    volumes:
      - ./include/:/www/esit/include
      - ./public/img:/www/esit/public/img
      - ./public/login:/www/esit/public/login
      - ./public/include/resources:/www/esit/public/include/resources
      - ./setup/nginx.conf.example:/etc/nginx/nginx.conf
      - ./setup/default.conf.example:/etc/nginx/conf.d/default.conf
      - ./setup/fastcgi-php.conf.example:/etc/nginx/snippets/fastcgi-php.conf
    depends_on:
      - worker
  
  php-fpm:
    build:
      dockerfile: ./setup/php-dockerfile
      args:
      - UID=${H_UID:-1000}
      - GID=${H_GID:-1000}
    env_file: .env
    volumes:
      - ./include/:/www/esit/include
      - ./locale/:/www/esit/locale
      - ./public/img:/www/esit/public/img
      - ./public/login:/www/esit/public/login
      - ./public/include/resources:/www/esit/public/include/resources
    depends_on:
      - rabbitmq

  mysql:
    build:
      dockerfile: ./setup/mysql-dockerfile
    env_file: .env
    depends_on:
      - php-fpm
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "esit_db", "-pesit_db"]
      timeout: 2s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3-alpine@sha256:c9eb1a8a97cd1067e5645888d31c4947ecb553eda4e8a0159937bc08d06f7182
    env_file: .env
    volumes:
      - ./setup/rabbitmq-enabled-plugins.example:/etc/rabbitmq/enabled_plugins
      - ./setup/definitions.rabbitmq.json.example:/etc/rabbitmq/definitions.json
      - ./setup/rabbitmq.config.example:/etc/rabbitmq/rabbitmq.conf

  worker:
    build:
      dockerfile: ./setup/worker-dockerfile
    env_file: .env
    volumes:
      - ./worker/:/worker/
    security_opt:
      - seccomp:./setup/seccomp.json
      - apparmor:unconfined  # Required for nsjail to manage its own sandboxing without host-level AppArmor configuration.
                             # Docker's AppArmor profile interferes with nsjail sandboxing (we don't want --privileged here).
    command: python3 /worker/mq_receiver.py
    depends_on:
      mysql:
        condition: service_healthy
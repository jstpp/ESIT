name: "esit_cpp_sandbox"
description: "C++ 'safe' execution for ESIT"

mode: ONCE
hostname: "esit_cpp_sandbox"

keep_env: false
envar: "LANG=pl_PL.UTF-8"
envar: "OMP_NUM_THREADS=1"
envar: "OPENBLAS_NUM_THREADS=1"
envar: "MKL_NUM_THREADS=1"
envar: "VECLIB_MAXIMUM_THREADS=1"
envar: "NUMEXPR_NUM_THREADS=1"
envar: "PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

keep_caps: false

max_cpus: 1

clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

uidmap {
	inside_id: "9999"
	outside_id: "0"
	count: 1
}

gidmap {
	inside_id: "9999"
	outside_id: "0"
	count: 1
}

mount_proc: false

mount {
    src: "/etc/ld.so.cache"
    dst: "/etc/ld.so.cache"
    is_bind: true
    rw: false
}

mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    rw: false
}
mount {
    src: "/usr/bin/g++"
    dst: "/usr/bin/g++"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/bin/gcc"
    dst: "/usr/bin/gcc"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/bin/as"
    dst: "/usr/bin/as"
    is_bind: true
    rw: false
}
mount {
    src: "/usr/bin/ld"
    dst: "/usr/bin/ld"
    is_bind: true
    rw: false
}

mount {
    src: "/bin/g++"
    dst: "/bin/g++"
    is_bind: true
    rw: false
}

mount {
    src: "/bin/gcc"
    dst: "/bin/gcc"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/libexec"
    dst: "/usr/libexec"
    is_bind: true
    rw: false
}

mount {
    src: "/bin/as"
    dst: "/bin/as"
    is_bind: true
    rw: false
}
mount {
    src: "/bin/ld"
    dst: "/bin/ld"
    is_bind: true
    rw: false
}

mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/lib"
    dst: "/usr/lib"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/lib/x86_64-linux-gnu"
    dst: "/usr/lib/x86_64-linux-gnu"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/include"
    dst: "/usr/include"
    is_bind: true
    rw: false
}

mount {
    src: "/dev/random"
    dst: "/dev/random"
    is_bind: true
    rw: false
}

mount {
    src: "/dev/null"
    dst: "/dev/null"
    is_bind: true
    rw: true
}

mount {
    src: "/dev/zero"
    dst: "/dev/zero"
    is_bind: true
    rw: true
}

iface_no_lo: true

seccomp_string: "   ALLOW {"
seccomp_string: "    newstat, newfstat, newlstat, access, read, write, writev, arch_prctl, openat, close, newfstatat, statx, lseek,"
seccomp_string: "    mmap, mprotect, munmap, brk, madvise,"
seccomp_string: "    faccessat, faccessat2, getcwd,"
seccomp_string: "    getuid, geteuid, getgid, getegid,"
seccomp_string: "    rt_sigaction, rt_sigprocmask, rt_sigreturn, sigaltstack,"
seccomp_string: "    exit, exit_group, execve, execveat,"
seccomp_string: "    gettimeofday, clock_gettime, newuname, readlinkat, sysinfo, fcntl, ioctl,"
seccomp_string: "    futex, set_tid_address, set_robust_list, prlimit64, pread64, getrandom, rseq,"
seccomp_string: "    exit, exit_group, clone, fork, vfork, pipe, pipe2, unlink, unlinkat,"
seccomp_string: "    mkdir, rmdir, getdents, getdents64, chmod, fchmod, wait4, waitid"
seccomp_string: "   }"
seccomp_string: "   DEFAULT ERRNO(38)"
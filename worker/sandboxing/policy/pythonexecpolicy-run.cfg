name: "esit_python_sandbox"
description: "Python safe execution for ESIT"

mode: ONCE
hostname: "esit_python_sandbox"

keep_env: false
envar: "LANG=pl_PL.UTF-8"
envar: "OMP_NUM_THREADS=1"
envar: "OPENBLAS_NUM_THREADS=1"
envar: "MKL_NUM_THREADS=1"
envar: "VECLIB_MAXIMUM_THREADS=1"
envar: "NUMEXPR_NUM_THREADS=1"
envar: "PYTHONPATH=/usr/lib/python3.8/site-packages/"
envar: "PYTHONIOENCODING=utf-8:strict"

keep_caps: false

max_cpus: 1

clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

uidmap {
	inside_id: "9999"
	outside_id: "0"
	count: 1
}

gidmap {
	inside_id: "9999"
	outside_id: "0"
	count: 1
}

mount_proc: false

mount {
    src: "/etc/ld.so.cache"
    dst: "/etc/ld.so.cache"
    is_bind: true
    rw: false
}

mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    rw: false
}

mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/lib"
    dst: "/usr/lib"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/local/lib"
    dst: "/usr/local/lib"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/local/bin/python3"
    dst: "/usr/local/bin/python3"
    is_bind: true
    rw: false
}

mount {
    src: "/dev/random"
    dst: "/dev/random"
    is_bind: true
    rw: false
}

mount {
    src: "/dev/urandom"
    dst: "/dev/urandom"
    is_bind: true
    rw: false
}

mount {
    src: "/dev/null"
    dst: "/dev/null"
    is_bind: true
    rw: true
}

mount {
    src: "/dev/zero"
    dst: "/dev/zero"
    is_bind: true
    rw: true
}

iface_no_lo: true

seccomp_string: "   ALLOW {"
seccomp_string: "    openat, close, read, write, writev, lseek, fcntl, ioctl, access, faccessat, faccessat2,"
seccomp_string: "    newstat, newfstat, newlstat, newfstatat, statx, getdents, getdents64, getcwd, readlink, readlinkat,"
seccomp_string: "    brk, mmap, mprotect, munmap, madvise, arch_prctl,"
seccomp_string: "    exit, exit_group, rt_sigaction, rt_sigprocmask, rt_sigreturn, sigaltstack,"
seccomp_string: "    getuid, geteuid, getgid, getegid, getpid, getppid, gettid,"
seccomp_string: "    futex, set_tid_address, set_robust_list, rseq,"
seccomp_string: "    dup, dup2, dup3, pipe, pipe2, execve,"
seccomp_string: "    getrandom, clock_gettime, gettimeofday, newuname, sysinfo, prlimit64, pread64"
seccomp_string: "   }"
seccomp_string: "   DEFAULT ERRNO(38)"
name: "esit_rust_sandbox"
description: "Rust 'safe' execution for ESIT"

mode: ONCE
hostname: "esit_rust_sandbox"

keep_env: false
envar: "LANG=pl_PL.UTF-8"
envar: "OMP_NUM_THREADS=1"
envar: "OPENBLAS_NUM_THREADS=1"
envar: "MKL_NUM_THREADS=1"
envar: "VECLIB_MAXIMUM_THREADS=1"
envar: "NUMEXPR_NUM_THREADS=1"
envar: "PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

keep_caps: false

max_cpus: 1
oom_score_adj: 1000

clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

rlimit_fsize: 512

uidmap {
	inside_id: "9999"
	outside_id: "10001"
	count: 1
}

gidmap {
	inside_id: "9999"
	outside_id: "10001"
	count: 1
}

mount_proc: false

mount {
    dst: "/tmp"
    fstype: "tmpfs"
    rw: true
    options: "size=536870912,mode=0777"
}

mount {
    src: "/etc/ld.so.cache"
    dst: "/etc/ld.so.cache"
    is_bind: true
    rw: false
}

mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/bin/rustc"
    dst: "/usr/bin/rustc"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/bin/g++"
    dst: "/usr/bin/g++"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/bin/gcc"
    dst: "/usr/bin/gcc"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/bin/as"
    dst: "/usr/bin/as"
    is_bind: true
    rw: false
}
mount {
    src: "/usr/bin/ld"
    dst: "/usr/bin/ld"
    is_bind: true
    rw: false
}

mount {
    src: "/bin/g++"
    dst: "/bin/g++"
    is_bind: true
    rw: false
}

mount {
    src: "/bin/gcc"
    dst: "/bin/gcc"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/libexec"
    dst: "/usr/libexec"
    is_bind: true
    rw: false
}

mount {
    src: "/bin/as"
    dst: "/bin/as"
    is_bind: true
    rw: false
}
mount {
    src: "/bin/ld"
    dst: "/bin/ld"
    is_bind: true
    rw: false
}
mount {
    src: "/bin/cc"
    dst: "/bin/cc"
    is_bind: true
    rw: false
}

mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/lib"
    dst: "/usr/lib"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/lib/gcc"
    dst: "/usr/lib/gcc"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/lib/x86_64-linux-gnu"
    dst: "/usr/lib/x86_64-linux-gnu"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/include"
    dst: "/usr/include"
    is_bind: true
    rw: false
}

mount {
    src: "/dev/random"
    dst: "/dev/random"
    is_bind: true
    rw: false
}

mount {
    src: "/dev/null"
    dst: "/dev/null"
    is_bind: true
    rw: true
}

mount {
    src: "/dev/zero"
    dst: "/dev/zero"
    is_bind: true
    rw: true
}

iface_no_lo: true

seccomp_string: "   ALLOW {"
seccomp_string: "    newstat, newfstat, newlstat, access, read, write, writev, arch_prctl, openat, close, newfstatat, statx, lseek,"
seccomp_string: "    mmap, mprotect, munmap, brk, madvise, mremap, membarrier,"
seccomp_string: "    faccessat, faccessat2, getcwd, dup, dup2,"
seccomp_string: "    getuid, geteuid, getgid, getegid, gettid, getpid, getrusage,"
seccomp_string: "    rt_sigaction, rt_sigprocmask, rt_sigreturn, sigaltstack, tgkill, tkill,"
seccomp_string: "    exit, exit_group, execve, execveat,"
seccomp_string: "    gettimeofday, clock_gettime, clock_nanosleep, nanosleep, newuname, readlinkat, sysinfo, fcntl, ioctl, prctl, readlink,"
seccomp_string: "    futex, set_tid_address, set_robust_list, prlimit64, pread64, getrandom, rseq,"
seccomp_string: "    clone, clone3, fork, vfork, sched_getaffinity, sched_setaffinity, sched_yield, getpriority, setpriority,"
seccomp_string: "    pipe, pipe2, eventfd2, epoll_create1, epoll_ctl, epoll_wait, poll, pselect6, ppoll, timerfd_create,"
seccomp_string: "    unlink, unlinkat, mkdir, rmdir, getdents, getdents64, chmod, fchmod, wait4, waitid, umask,"
seccomp_string: "    exit, exit_group"
seccomp_string: "   }"
seccomp_string: "   DEFAULT ERRNO(38)"
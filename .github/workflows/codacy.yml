
name: Codacy Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          directory: .
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Validate SARIF report
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s results.sarif ]]; then
            echo "::error::SARIF report is missing or empty."
            exit 1
          fi

          if ! jq -e '
            .version == "2.1.0"
            and (.runs | type == "array")
            and (.runs | length > 0)
            and all(.runs[];
              (.tool.driver.name | type == "string" and length > 0)
            )
          ' results.sarif >/dev/null; then
            echo "::error::Invalid SARIF report."
            jq '{version, runs_count: ((.runs // []) | length)}' results.sarif
            exit 1
          fi

          echo "SARIF report is valid."
          jq '{
            version,
            runs: [
              .runs[] | {
                tool: .tool.driver.name,
                results_count: ((.results // []) | length)
              }
            ]
          }' results.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26
        with:
          sarif_file: results.sarif

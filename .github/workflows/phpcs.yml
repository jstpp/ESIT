
name: PHP_CodeSniffer

on:
  push:
    branches:
      - main
    paths:
      - "**.php"
      - "phpcs.xml"
      - ".github/workflows/phpcs.yml"

  pull_request:
    paths:
      - "**.php"
      - "phpcs.xml"
      - ".github/workflows/phpcs.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpcs:
    name: PHP Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.5"
          tools: none

      - name: Install PHP_CodeSniffer
        run: |
          curl -fsSL \
            https://squizlabs.github.io/PHP_CodeSniffer/phpcs.phar \
            -o phpcs.phar

          php phpcs.phar --version

      - name: Run PHP_CodeSniffer
        uses: Novusvetus/action-php_codesniffer@09a4230052b2d590e382178d7c74168eacd7c2d7
        with:
          files: "**.php"
          scan_all: false
          phpcs_path: php phpcs.phar
          standard: phpcs.xml
          fail_on_warnings: false
